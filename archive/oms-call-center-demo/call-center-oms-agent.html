<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1440">
<title>Carnival UK — Call Center OMS Agent</title>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --color-bg-page:#F0EFF4;
  --color-primary:#6B3FA0;
  --color-primary-light:#EDE9F7;
  --color-primary-dark:#4A2B72;
  --color-success:#1A7F4B;
  --color-success-bg:#ECFDF5;
  --color-warning:#B45309;
  --color-warning-bg:#FFFBEB;
  --color-danger:#C0392B;
  --color-danger-bg:#FEF2F0;
  --color-surface:#FFFFFF;
  --color-surface-2:#F8F8FA;
  --color-border:#E4E4E7;
  --color-text:#18181B;
  --color-text-muted:#71717A;
  --color-text-faint:#A1A1AA;
  --color-call-bar-bg:#1C1C1E;
  --color-call-timer:#34C759;
  --panel-left:320px;
  --panel-right:320px;
  --panel-radius:12px;
  --panel-shadow:0 2px 8px rgba(0,0,0,0.08),0 0 1px rgba(0,0,0,0.10);
  --panel-gap:12px;
  --sidebar-width:48px;
  --topnav-height:48px;
  --font-base:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --font-mono:"SF Mono","Fira Code",monospace;
}
html,body{height:100%;font-family:var(--font-base);font-size:13px;color:var(--color-text);background:var(--color-bg-page);overflow:hidden;}
:focus-visible{outline:2px solid var(--color-primary);outline-offset:2px;}
button{cursor:pointer;font-family:inherit;font-size:inherit;}
input,textarea,select{font-family:inherit;font-size:inherit;}

/* ── INFIOS TOP NAV ── */
.top-nav{
  height:var(--topnav-height);
  background:#111113;
  border-bottom:1px solid #1E1E22;
  display:flex;align-items:center;
  padding:0 16px 0 60px;gap:12px;
  position:fixed;top:0;left:0;right:0;
  z-index:99;
}
.top-nav-brand{color:#A3C44A;font-weight:700;font-size:16px;letter-spacing:-0.5px;}
.top-nav-sep{width:1px;height:20px;background:#2E2E38;flex-shrink:0;}
.top-nav-section{color:#9090A8;font-size:13px;}
.top-nav-avatar{width:36px;height:36px;background:#3A2A50;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#A3C44A;letter-spacing:0.5px;flex-shrink:0;}
.top-nav-icon{color:#6B6B80;display:flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:6px;cursor:pointer;}
.top-nav-icon:hover{color:#A1A1AA;}

/* ── INFIOS SIDEBAR ── */
.sidebar{
  width:var(--sidebar-width);height:100vh;
  background:#F2F2F5;
  display:flex;flex-direction:column;align-items:center;
  padding:8px 0 12px;gap:4px;
  position:fixed;left:0;top:0;
  z-index:100;
  border-right:1px solid #E2E2E8;
}
.sidebar-brand{margin-bottom:8px;display:flex;align-items:center;justify-content:center;width:36px;height:36px;}
.sidebar-sep{height:1px;background:#D8D8E0;width:28px;margin:4px 0;flex-shrink:0;}
.sidebar-icon{
  width:36px;height:36px;
  display:flex;align-items:center;justify-content:center;
  border-radius:8px;color:#6B6B80;
  cursor:pointer;border:none;background:transparent;
  transition:background 150ms,color 150ms;
  flex-shrink:0;
}
.sidebar-icon:hover{background:#E4E4EA;color:#18181B;}
.sidebar-icon.active{background:#1E1E24;color:#A3C44A;border-radius:10px;}

/* ── DEV TOOLBAR ── */
#dev-toolbar{
  position:fixed;top:var(--topnav-height);left:0;right:0;height:40px;
  background:#111111;display:flex;align-items:center;gap:6px;
  padding:0 12px 0 60px;z-index:99;
}
.toolbar-label{font-size:10px;font-weight:700;letter-spacing:.1em;color:#444;text-transform:uppercase;margin-right:4px;font-family:var(--font-mono);}
.tb-btn{
  background:transparent;border:1px solid #2A2A2A;color:#71717A;
  border-radius:5px;padding:3px 10px;font-size:11px;transition:all .15s;
  font-family:var(--font-mono);
}
.tb-btn:hover{background:#1E1E1E;color:#A1A1AA;}
.tb-btn.active{background:var(--color-primary);border-color:var(--color-primary);color:#fff;}

/* ── APP SHELL ── */
#app{
  display:flex;
  gap:var(--panel-gap);
  padding:var(--panel-gap);
  margin-top:calc(var(--topnav-height) + 40px);
  margin-left:var(--sidebar-width);
  height:calc(100vh - var(--topnav-height) - 40px);
  box-sizing:border-box;
  transition:margin-right 240ms ease;
}

/* ── PANEL BASE ── */
.panel{
  border-radius:var(--panel-radius);
  box-shadow:var(--panel-shadow);
  background:var(--color-surface);
  overflow:hidden;
}

/* ── LEFT PANEL ── */
#panel-left{
  width:var(--panel-left);
  min-width:var(--panel-left);
  max-width:var(--panel-left);
  display:flex;
  flex-direction:column;
}

/* ── CENTER AREA ── */
#center-area{
  flex:1;
  min-width:0;
  display:flex;
  flex-direction:column;
  gap:8px;
  transition:margin-right 240ms ease;
}
.right-open #center-area{
  margin-right:calc(var(--panel-right) + var(--panel-gap));
}

/* ── RIGHT PANEL ── */
#panel-right{
  position:fixed;
  right:var(--panel-gap);
  top:calc(var(--topnav-height) + 40px + var(--panel-gap));
  width:var(--panel-right);
  height:calc(100vh - var(--topnav-height) - 40px - var(--panel-gap) * 2);
  transform:translateX(calc(var(--panel-right) + var(--panel-gap)));
  transition:transform 240ms ease;
  z-index:200;
  display:flex;
  flex-direction:column;
}
.right-open #panel-right{
  transform:translateX(0);
}

/* ── TAB STRIP ── */
.tab-strip{
  display:flex;
  border-bottom:1px solid var(--color-border);
  background:var(--color-surface);
  flex-shrink:0;
}
.tab-btn{
  flex:1;padding:10px 4px;
  border:none;background:transparent;
  font-size:12px;font-weight:500;
  color:var(--color-text-muted);
  cursor:pointer;
  border-bottom:2px solid transparent;
  transition:all .15s;
}
.tab-btn.active{color:var(--color-primary);border-bottom-color:var(--color-primary);}
.tab-btn:hover:not(.active){color:var(--color-text);}

/* ── LEFT PANEL SECTIONS ── */
.lp-scroll{flex:1;overflow-y:auto;padding:0 0 4px;}
.lp-section{padding:10px 12px;border-bottom:1px solid var(--color-border);}
.lp-section:last-child{border-bottom:none;}
.section-label{font-size:10px;font-weight:700;letter-spacing:.08em;color:var(--color-text-faint);text-transform:uppercase;margin-bottom:6px;}

.customer-name{font-size:14px;font-weight:600;color:var(--color-text);margin-bottom:2px;display:flex;align-items:center;gap:6px;}
.customer-contact{font-size:12px;color:var(--color-text-muted);margin-bottom:6px;}
.badges-row{display:flex;gap:6px;flex-wrap:wrap;}
.hold-badge{background:#B45309;color:#fff;font-size:10px;font-weight:700;padding:1px 6px;border-radius:4px;letter-spacing:.05em;}

/* Badges */
.badge{display:inline-flex;align-items:center;font-size:10px;font-weight:600;padding:2px 7px;border-radius:100px;letter-spacing:.04em;}
.badge-verified{background:var(--color-success-bg);color:var(--color-success);}
.badge-platinum{background:#FEF3C7;color:#92400E;}
.badge-confirmed{background:var(--color-success-bg);color:var(--color-success);}
.badge-on-hold{background:var(--color-warning-bg);color:var(--color-warning);}
.badge-cancelled{background:var(--color-danger-bg);color:var(--color-danger);}
.badge-success{background:var(--color-success-bg);color:var(--color-success);}
.badge-warning{background:var(--color-warning-bg);color:var(--color-warning);}
.badge-danger{background:var(--color-danger-bg);color:var(--color-danger);}
.badge-resolved{background:var(--color-success-bg);color:var(--color-success);}
.badge-escalated{background:var(--color-danger-bg);color:var(--color-danger);}
.badge-callback{background:var(--color-warning-bg);color:var(--color-warning);}
.badge-active-bk{background:var(--color-primary-light);color:var(--color-primary);font-size:10px;font-weight:600;padding:2px 7px;border-radius:100px;}

/* Customer need textarea */
#customer-need{
  width:100%;border:1px solid var(--color-border);border-radius:6px;
  padding:6px 8px;resize:none;font-size:12px;color:var(--color-text);
  background:var(--color-surface-2);margin-bottom:3px;
}
#customer-need:focus{outline:2px solid var(--color-primary);outline-offset:0;border-color:var(--color-primary);}
.char-count{font-size:10px;color:var(--color-text-faint);text-align:right;}

/* Note cards */
.note-card{background:var(--color-surface-2);border-radius:6px;padding:6px 8px;margin-bottom:6px;border:1px solid var(--color-border);}
.note-date{font-size:10px;color:var(--color-text-faint);margin-bottom:2px;}
.note-text{font-size:11px;color:var(--color-text-muted);line-height:1.4;}

/* Link buttons */
.link-btn{background:none;border:none;color:var(--color-primary);font-size:11px;cursor:pointer;padding:0;margin-top:4px;}
.link-btn:hover{text-decoration:underline;}

/* Chips */
.chips-row{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:4px;}
.topic-chip{background:var(--color-primary-light);color:var(--color-primary);font-size:11px;font-weight:500;padding:3px 8px;border-radius:100px;}

/* Channel chips */
.channel-chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 12px;border-bottom:1px solid var(--color-border);}
.channel-chip{
  background:var(--color-surface-2);border:1px solid var(--color-border);
  color:var(--color-text-muted);font-size:11px;font-weight:500;
  padding:5px 10px;border-radius:100px;cursor:pointer;transition:all .15s;
}
.channel-chip:hover{border-color:var(--color-primary);color:var(--color-primary);}
.channel-chip.selected{background:var(--color-primary);border-color:var(--color-primary);color:#fff;}

/* Related bookings */
.related-bk-card{
  border:1.5px solid var(--color-border);border-radius:8px;
  padding:8px 10px;margin-bottom:6px;cursor:pointer;
  transition:all .15s;
}
.related-bk-card:hover{border-color:var(--color-primary);}
.related-bk-card.active-bk{border-color:var(--color-primary);background:var(--color-primary-light);}
.rb-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:2px;}
.rb-id{font-size:11px;font-weight:700;color:var(--color-text);font-family:var(--font-mono);}
.rb-guest{font-size:11px;color:var(--color-text-muted);margin-bottom:4px;}
.rb-footer{display:flex;align-items:center;justify-content:space-between;}
.rb-total{font-size:12px;font-weight:600;color:var(--color-text);}
.set-active-btn{background:none;border:1px solid var(--color-border);color:var(--color-text-muted);font-size:10px;padding:2px 7px;border-radius:4px;cursor:pointer;transition:all .15s;}
.set-active-btn:hover{border-color:var(--color-primary);color:var(--color-primary);}

/* Quick actions */
.quick-action-btn{
  display:flex;align-items:center;gap:6px;width:100%;
  background:var(--color-surface-2);border:1px solid var(--color-border);
  color:var(--color-text);font-size:12px;padding:7px 10px;
  border-radius:6px;margin-bottom:5px;transition:all .15s;text-align:left;
}
.quick-action-btn:hover{border-color:var(--color-primary);background:var(--color-primary-light);color:var(--color-primary);}
.icon-xs{width:12px;height:12px;flex-shrink:0;}
.icon-sm{width:14px;height:14px;flex-shrink:0;}

/* LP Footer */
.lp-footer{
  display:flex;flex-wrap:wrap;gap:4px;padding:8px;
  border-top:1px solid var(--color-border);flex-shrink:0;
  background:var(--color-surface);
}
.footer-btn{
  flex:1;min-width:calc(50% - 4px);
  display:flex;align-items:center;justify-content:center;gap:5px;
  background:var(--color-surface-2);border:1px solid var(--color-border);
  color:var(--color-text-muted);font-size:11px;padding:6px 4px;
  border-radius:6px;transition:all .15s;
}
.footer-btn:hover{border-color:var(--color-primary);color:var(--color-primary);background:var(--color-primary-light);}
.footer-btn--warn:hover{border-color:var(--color-danger);color:var(--color-danger);background:var(--color-danger-bg);}
.footer-btn svg{width:12px;height:12px;}

/* ── CALL BAR ── */
.call-bar-card{
  background:var(--color-call-bar-bg);
  border-radius:var(--panel-radius);
  box-shadow:0 4px 16px rgba(0,0,0,0.24);
  padding:10px 16px;
  display:flex;
  align-items:center;
  gap:16px;
  color:#fff;
  flex-shrink:0;
  position:relative;
  transition:opacity 200ms ease,transform 200ms ease;
}
.call-bar-card[hidden]{display:none!important;}
.call-bar-group{display:flex;align-items:center;gap:8px;}
.call-bar-timer{font-family:var(--font-mono);font-size:18px;font-weight:600;color:var(--color-call-timer);min-width:52px;}
.call-bar-label{font-size:12px;color:rgba(255,255,255,.6);}
.call-bar-controls{gap:4px;}
.cb-btn{
  display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:6px 12px;border-radius:8px;border:none;
  background:rgba(255,255,255,.08);color:#fff;cursor:pointer;
  font-size:11px;font-family:var(--font-base);transition:background .15s;
}
.cb-btn:hover{background:rgba(255,255,255,.15);}
.cb-btn.active-hold{background:#B45309;color:#fff;}
.cb-btn.active-mute{background:#C0392B;color:#fff;}
.cb-end-btn{
  width:40px;height:40px;border-radius:50%;
  background:#C0392B;border:none;color:#fff;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:background .15s;
}
.cb-end-btn:hover{background:#a93226;}
.cb-end-confirm{display:flex;align-items:center;gap:8px;flex:1;justify-content:center;}
.cb-end-confirm span{color:rgba(255,255,255,.8);font-size:12px;}
.cb-confirm-btn{background:#C0392B;border:none;color:#fff;font-size:11px;font-weight:600;padding:6px 14px;border-radius:6px;cursor:pointer;}
.cb-confirm-btn:hover{background:#a93226;}
.cb-cancel-btn{background:rgba(255,255,255,.12);border:none;color:#fff;font-size:11px;padding:6px 14px;border-radius:6px;cursor:pointer;}
.cb-cancel-btn:hover{background:rgba(255,255,255,.2);}

/* Keypad */
.keypad-modal{
  position:absolute;top:calc(100% + 8px);left:50%;transform:translateX(-50%);
  background:#1C1C1E;border:1px solid #333;border-radius:12px;
  padding:12px;width:200px;z-index:500;box-shadow:0 8px 24px rgba(0,0,0,.4);
}
.keypad-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;color:#fff;font-size:12px;font-weight:600;}
.keypad-header button{background:none;border:none;color:#71717A;font-size:14px;cursor:pointer;}
.keypad-display{background:#111;border-radius:6px;padding:6px 10px;font-family:var(--font-mono);font-size:16px;color:var(--color-call-timer);min-height:32px;margin-bottom:8px;letter-spacing:.1em;}
.keypad-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;}
.kp-key{background:rgba(255,255,255,.1);border:none;color:#fff;font-size:15px;font-weight:500;padding:10px;border-radius:8px;cursor:pointer;transition:background .15s;}
.kp-key:hover{background:rgba(255,255,255,.2);}

/* Contacts dropdown */
.contacts-dropdown{
  position:absolute;top:calc(100% + 8px);left:50%;transform:translateX(-50%);
  background:#1C1C1E;border:1px solid #333;border-radius:10px;
  padding:6px;width:220px;z-index:500;box-shadow:0 8px 24px rgba(0,0,0,.4);
}
.contact-row{display:flex;flex-direction:column;padding:8px 10px;border-radius:7px;cursor:pointer;transition:background .15s;}
.contact-row:hover{background:rgba(255,255,255,.1);}
.contact-name{font-size:12px;font-weight:600;color:#fff;}
.contact-phone{font-size:11px;color:rgba(255,255,255,.5);font-family:var(--font-mono);}

/* ── AGENT WORKSPACE ── */
#agent-workspace{flex:1;display:flex;flex-direction:column;min-height:0;}
.agent-header{
  display:flex;align-items:center;gap:10px;padding:10px 14px;
  border-bottom:1px solid var(--color-border);flex-shrink:0;background:var(--color-surface);
}
.agent-header-left{display:flex;align-items:center;gap:6px;}
.agent-title{font-size:14px;font-weight:700;color:var(--color-text);}
.agent-sep{color:var(--color-border);margin:0 2px;}
.agent-status-dot{width:7px;height:7px;border-radius:50%;background:#34C759;flex-shrink:0;}
.agent-status-text{font-size:11px;color:var(--color-text-muted);}
.agent-header-center{flex:1;display:flex;justify-content:center;}
.agent-header-right{display:flex;align-items:center;gap:8px;flex-shrink:0;}

.active-pill{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:100px;font-size:11px;font-weight:600;}
.active-pill svg{width:11px;height:11px;}
.active-pill-active{background:var(--color-primary);color:#fff;}
.active-pill-none{background:var(--color-surface-2);color:var(--color-text-faint);border:1px solid var(--color-border);}

.new-session-btn{background:var(--color-surface-2);border:1px solid var(--color-border);color:var(--color-text-muted);font-size:11px;padding:4px 10px;border-radius:6px;cursor:pointer;transition:all .15s;}
.new-session-btn:hover{border-color:var(--color-primary);color:var(--color-primary);}

.chat-area{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px;}

/* Chat messages */
.agent-bubble-wrap{display:flex;gap:8px;align-items:flex-start;}
.agent-avatar{width:26px;height:26px;border-radius:50%;background:var(--color-primary);display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;}
.agent-avatar svg{width:13px;height:13px;color:#fff;}
.agent-bubble{background:var(--color-surface-2);border:1px solid var(--color-border);border-radius:0 10px 10px 10px;padding:8px 12px;font-size:12px;line-height:1.5;color:var(--color-text);max-width:520px;}
.agent-bubble strong{color:var(--color-primary);}

/* Empty state */
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;text-align:center;padding:20px;}
.empty-icon{font-size:32px;margin-bottom:8px;}
.empty-title{font-size:18px;font-weight:700;color:var(--color-text);margin-bottom:6px;}
.empty-sub{font-size:13px;color:var(--color-text-muted);margin-bottom:16px;}
.starter-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%;max-width:520px;}
.starter-card{
  background:var(--color-surface-2);border:1px solid var(--color-border);
  border-radius:8px;padding:10px 12px;font-size:12px;color:var(--color-text);
  cursor:pointer;text-align:left;transition:all .15s;line-height:1.4;
}
.starter-card:hover{border-color:var(--color-primary);background:var(--color-primary-light);}
.starter-card small{color:var(--color-text-faint);font-size:11px;display:block;margin-top:3px;}

/* Action cards */
.action-card{
  border:1.5px solid var(--color-border);border-radius:10px;overflow:hidden;
  cursor:pointer;transition:all .15s;
}
.action-card:hover{border-color:var(--color-primary);box-shadow:0 0 0 3px var(--color-primary-light);}
.action-card-lookup{}
.action-card-blocked{cursor:default;}
.action-card-success{border-color:var(--color-success);}
.action-card-success:hover{border-color:var(--color-success);box-shadow:0 0 0 3px var(--color-success-bg);}
.ac-header{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--color-surface-2);border-bottom:1px solid var(--color-border);}
.blocked-header{background:var(--color-danger-bg);}
.success-header{background:var(--color-success-bg);border-bottom-color:rgba(26,127,75,.2);}
.success-header svg{color:var(--color-success);}
.ac-icon{color:var(--color-primary);}
.ac-icon svg{width:14px;height:14px;}
.ac-title{font-size:10px;font-weight:700;letter-spacing:.08em;color:var(--color-text-faint);text-transform:uppercase;flex:1;}
.ac-bid{font-size:11px;font-weight:700;font-family:var(--font-mono);color:var(--color-text);}
.ac-edit-hint{font-size:10px;color:var(--color-primary);opacity:.6;margin-left:auto;}
.action-card:hover .ac-edit-hint{opacity:1;}
.ac-body{padding:10px 12px;}

/* Meta grid */
.meta-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;margin-bottom:10px;}
.meta-grid > div{display:flex;flex-direction:column;gap:1px;}
.meta-label{font-size:10px;color:var(--color-text-faint);font-weight:600;text-transform:uppercase;letter-spacing:.05em;}
.meta-val{font-size:12px;color:var(--color-text);font-weight:500;}

/* Line items */
.line-item-row{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--color-border);flex-wrap:wrap;}
.service-tag{font-size:10px;font-weight:700;padding:2px 6px;border-radius:4px;letter-spacing:.04em;}
.spa-tag{background:#EDE9F7;color:#6B3FA0;}
.exp-tag{background:#FEF3C7;color:#92400E;}
.retail-tag{background:#ECFDF5;color:#1A7F4B;}
.li-name{font-size:12px;font-weight:500;flex:1;}
.li-detail{font-size:11px;color:var(--color-text-muted);}
.li-price{font-size:12px;font-weight:700;color:var(--color-text);margin-left:auto;}
.ac-total-row{display:flex;justify-content:space-between;padding:6px 0;border-top:1px solid var(--color-border);font-size:12px;margin-top:4px;}
.ac-total-row strong{font-size:13px;}
.ac-actions{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;padding:7px 14px;border-radius:7px;font-size:12px;font-weight:600;border:none;cursor:pointer;transition:all .15s;text-align:center;}
.btn-primary{background:var(--color-primary);color:#fff;}
.btn-primary:hover{background:var(--color-primary-dark);}
.btn-primary:disabled{opacity:.4;cursor:not-allowed;}
.btn-secondary{background:var(--color-surface-2);border:1px solid var(--color-border);color:var(--color-text-muted);}
.btn-secondary:hover{border-color:var(--color-primary);color:var(--color-primary);}
.btn-danger-outline{background:transparent;border:1.5px solid var(--color-danger);color:var(--color-danger);}
.btn-danger-outline:hover{background:var(--color-danger-bg);}
.btn-danger-confirm{background:transparent;border:1.5px solid var(--color-danger);color:var(--color-danger);}
.btn-danger-confirm:hover{background:var(--color-danger-bg);}
.btn-danger-solid{background:var(--color-danger);color:#fff;border:1.5px solid var(--color-danger);}
.btn-danger-solid:hover{background:#a93226;}
.btn-warning{background:var(--color-warning);color:#fff;border:none;}
.btn-warning:hover{background:#9a4400;}
.btn-success-outline{background:transparent;border:1.5px solid var(--color-success);color:var(--color-success);}
.btn-success-outline:hover{background:var(--color-success-bg);}
.btn-sm{padding:4px 10px;font-size:11px;}

/* Action in progress */
.action-in-progress{
  display:flex;align-items:center;gap:8px;
  background:var(--color-primary-light);border:1px solid var(--color-primary);
  border-radius:8px;padding:8px 12px;font-size:12px;color:var(--color-primary);
}
.action-in-progress svg{width:14px;height:14px;flex-shrink:0;}
.action-in-progress-danger{background:var(--color-danger-bg);border-color:var(--color-danger);color:var(--color-danger);}

/* Blocked */
.blocked-reason{font-size:12px;font-weight:600;color:var(--color-danger);margin-bottom:4px;}
.blocked-tag{background:var(--color-danger);color:#fff;font-size:10px;font-weight:700;padding:2px 8px;border-radius:4px;letter-spacing:.06em;}
.blocked-header-box{border:1px solid var(--color-danger-bg);background:var(--color-danger-bg);border-radius:8px;padding:10px;margin-bottom:10px;display:flex;flex-direction:column;gap:4px;}
.blocked-header-box p{font-size:12px;}

/* Success card */
.conf-ref-box{background:var(--color-success-bg);border:1px solid rgba(26,127,75,.2);border-radius:8px;padding:10px;margin-bottom:10px;}
.conf-ref-label{font-size:10px;font-weight:700;letter-spacing:.08em;color:var(--color-success);text-transform:uppercase;margin-bottom:4px;}
.conf-ref-number{font-size:15px;font-weight:700;font-family:var(--font-mono);color:var(--color-success);}
.conf-summary{font-size:12px;color:var(--color-text-muted);margin-bottom:10px;}
.status-rows{display:flex;flex-direction:column;gap:4px;margin-bottom:10px;}
.status-row{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:6px;font-size:12px;}
.success-row{background:var(--color-success-bg);}
.status-icon{font-size:13px;}
.check-icon{margin-left:auto;color:var(--color-success);font-weight:700;}
.customer-summary-toggle{border:1px solid var(--color-border);border-radius:8px;overflow:hidden;margin-bottom:10px;}
.summary-toggle-btn{width:100%;display:flex;align-items:center;justify-content:space-between;padding:8px 12px;background:var(--color-surface-2);border:none;font-size:12px;font-weight:600;color:var(--color-text);cursor:pointer;}
.summary-toggle-btn:hover{background:var(--color-primary-light);}
.summary-toggle-btn svg{width:14px;height:14px;}
.customer-summary-content{padding:10px 12px;font-size:12px;color:var(--color-text-muted);line-height:1.5;background:var(--color-surface);}

/* Input bar */
.input-bar-wrapper{padding:8px 10px;border-top:1px solid var(--color-border);background:var(--color-surface);flex-shrink:0;}
.suggestion-chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:7px;}
.chip{
  background:var(--color-surface-2);border:1px solid var(--color-border);
  color:var(--color-text-muted);font-size:11px;font-weight:500;
  padding:4px 10px;border-radius:100px;cursor:pointer;transition:all .15s;
  white-space:nowrap;
}
.chip:hover{border-color:var(--color-primary);color:var(--color-primary);background:var(--color-primary-light);}
.input-bar{display:flex;gap:6px;align-items:center;}
.chat-input{
  flex:1;border:1px solid var(--color-border);border-radius:8px;
  padding:8px 12px;font-size:13px;background:var(--color-surface-2);
  color:var(--color-text);
}
.chat-input:focus{outline:2px solid var(--color-primary);outline-offset:0;border-color:var(--color-primary);}
.send-btn{
  width:34px;height:34px;border-radius:8px;background:var(--color-primary);
  border:none;color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;
  flex-shrink:0;transition:background .15s;
}
.send-btn:hover{background:var(--color-primary-dark);}
.send-btn svg{width:14px;height:14px;}

/* ── RIGHT PANEL ── */
.rp-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 14px;border-bottom:1px solid var(--color-border);flex-shrink:0;
  background:var(--color-surface);
}
.rp-header > div{display:flex;align-items:center;gap:8px;}
.rp-booking-id{font-size:12px;font-weight:700;font-family:var(--font-mono);color:var(--color-text);}
.rp-close-btn{background:none;border:1px solid var(--color-border);color:var(--color-text-muted);width:26px;height:26px;border-radius:6px;cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;}
.rp-close-btn:hover{border-color:var(--color-danger);color:var(--color-danger);}
.rp-action-title{padding:8px 14px;font-size:12px;font-weight:700;color:var(--color-primary);border-bottom:1px solid var(--color-border);flex-shrink:0;background:var(--color-primary-light);}
.rp-body{flex:1;overflow-y:auto;padding:12px 14px;}

/* Forms in right panel */
.form-field{display:flex;flex-direction:column;gap:3px;margin-bottom:10px;}
.form-field label{font-size:11px;font-weight:600;color:var(--color-text-muted);}
.form-input{border:1px solid var(--color-border);border-radius:6px;padding:6px 8px;font-size:12px;background:var(--color-surface-2);}
.form-input:focus{outline:2px solid var(--color-primary);outline-offset:0;border-color:var(--color-primary);}
.form-field-inline{display:flex;flex-direction:column;gap:2px;}
.form-field-inline label{font-size:10px;font-weight:600;color:var(--color-text-faint);}
.form-input-sm{border:1px solid var(--color-border);border-radius:5px;padding:4px 7px;font-size:12px;background:var(--color-surface-2);}
.form-input-sm:focus{outline:2px solid var(--color-primary);outline-offset:0;}
.li-edit-row{background:var(--color-surface-2);border:1px solid var(--color-border);border-radius:8px;padding:10px;margin-bottom:10px;}
.li-edit-name{font-size:12px;font-weight:600;margin-bottom:8px;display:flex;align-items:center;gap:6px;}
.li-edit-controls{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px;}
.stepper{display:flex;align-items:center;gap:6px;}
.stepper-btn{width:24px;height:24px;border-radius:5px;border:1px solid var(--color-border);background:var(--color-surface);font-size:15px;color:var(--color-text);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;line-height:1;}
.stepper-btn:hover{border-color:var(--color-primary);color:var(--color-primary);}
#guest-count{font-size:13px;font-weight:700;min-width:20px;text-align:center;}
.avail-indicator{font-size:11px;font-weight:600;}
.avail-ok{color:var(--color-success);}
.diff-section{background:var(--color-primary-light);border:1px solid var(--color-primary);border-radius:8px;padding:10px;margin-bottom:10px;}
.diff-label{font-size:10px;font-weight:700;letter-spacing:.07em;color:var(--color-primary);text-transform:uppercase;margin-bottom:6px;}
.diff-row{display:flex;align-items:center;gap:8px;font-size:12px;flex-wrap:wrap;}
.diff-before{color:var(--color-text-muted);text-decoration:line-through;}
.diff-arrow{color:var(--color-primary);font-weight:700;}
.diff-after{color:var(--color-primary);font-weight:600;}
.diff-price{font-size:11px;color:var(--color-text-muted);margin-top:4px;}
.rp-actions{display:flex;flex-direction:column;gap:6px;}

/* Cancel form */
.cancel-scope{border:1px solid var(--color-border);border-radius:8px;overflow:hidden;margin-bottom:10px;}
.scope-row{display:flex;gap:8px;padding:7px 10px;border-bottom:1px solid var(--color-border);font-size:12px;}
.scope-row:last-child{border-bottom:none;}
.scope-label{font-size:10px;font-weight:700;color:var(--color-text-faint);text-transform:uppercase;letter-spacing:.05em;width:50px;flex-shrink:0;padding-top:1px;}
.scope-val{color:var(--color-text);font-weight:500;}
.refund-box{background:var(--color-surface-2);border:1px solid var(--color-border);border-radius:8px;padding:10px;margin-bottom:10px;}
.refund-row{display:flex;justify-content:space-between;font-size:12px;padding:3px 0;}
.refund-total{border-top:1px solid var(--color-border);padding-top:6px;margin-top:4px;font-weight:600;}
.policy-note{font-size:11px;color:var(--color-success);background:var(--color-success-bg);border:1px solid rgba(26,127,75,.2);border-radius:6px;padding:8px;margin-bottom:12px;line-height:1.4;}

/* Alt table */
.alt-table{width:100%;border-collapse:collapse;font-size:12px;}
.alt-table td{padding:7px 6px;border-bottom:1px solid var(--color-border);}
.alt-table tr:last-child td{border-bottom:none;}

/* Bookings tab */
.bookings-search-bar{padding:8px 10px;display:flex;flex-direction:column;gap:6px;border-bottom:1px solid var(--color-border);}
.bookings-search-input{border:1px solid var(--color-border);border-radius:6px;padding:5px 10px;font-size:12px;width:100%;background:var(--color-surface-2);}
.bookings-search-input:focus{outline:2px solid var(--color-primary);outline-offset:0;}
.filter-chips{display:flex;gap:4px;flex-wrap:wrap;}
.filter-chip{background:var(--color-surface-2);border:1px solid var(--color-border);color:var(--color-text-muted);font-size:10px;font-weight:600;padding:3px 8px;border-radius:100px;cursor:pointer;transition:all .15s;letter-spacing:.03em;}
.filter-chip:hover{border-color:var(--color-primary);color:var(--color-primary);}
.filter-chip.active{background:var(--color-primary);border-color:var(--color-primary);color:#fff;}
.bookings-list{flex:1;overflow-y:auto;}
.bk-row{
  display:flex;flex-direction:column;gap:2px;padding:8px 12px;
  border-bottom:1px solid var(--color-border);cursor:pointer;
  transition:all .15s;border-left:3px solid transparent;
}
.bk-row:hover{background:var(--color-surface-2);}
.bk-row.active-bk-row{border-left-color:var(--color-primary);background:var(--color-primary-light);}
.bk-row-header{display:flex;align-items:center;justify-content:space-between;}
.bk-row-id{font-size:11px;font-weight:700;font-family:var(--font-mono);color:var(--color-text);}
.bk-row-guest{font-size:12px;font-weight:500;color:var(--color-text);}
.bk-row-meta{font-size:11px;color:var(--color-text-muted);}
.bk-row-footer{display:flex;justify-content:space-between;align-items:center;}
.bk-row-total{font-size:12px;font-weight:700;}
.bookings-pagination{display:flex;align-items:center;justify-content:space-between;padding:6px 10px;border-top:1px solid var(--color-border);font-size:11px;color:var(--color-text-muted);flex-shrink:0;}
.pg-btn{background:none;border:1px solid var(--color-border);color:var(--color-text-muted);padding:2px 8px;border-radius:4px;cursor:pointer;font-size:11px;}
.pg-btn:hover{border-color:var(--color-primary);color:var(--color-primary);}
.pg-btn:disabled{opacity:.4;cursor:not-allowed;}

/* Call tab */
.call-summary-block{padding:10px 12px;border-bottom:1px solid var(--color-border);}
.call-active-row{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:600;margin-bottom:2px;}
.green-dot{width:8px;height:8px;border-radius:50%;background:#34C759;flex-shrink:0;}
.call-tab-timer{font-family:var(--font-mono);font-size:12px;color:var(--color-success);margin-left:auto;}
.call-meta{font-size:11px;color:var(--color-text-muted);}
.call-summary-textarea{width:100%;border:1px solid var(--color-border);border-radius:6px;padding:6px 8px;font-size:12px;resize:none;background:var(--color-surface-2);margin-top:4px;color:var(--color-text);}
.call-summary-textarea:focus{outline:2px solid var(--color-primary);}
.no-call-placeholder{padding:20px 12px;text-align:center;color:var(--color-text-faint);font-size:12px;}
.call-history-row{padding:8px 12px;border-bottom:1px solid var(--color-border);display:flex;flex-direction:column;gap:2px;}
.ch-date{font-size:10px;color:var(--color-text-faint);}
.ch-customer{font-size:12px;font-weight:600;}
.ch-meta{font-size:11px;color:var(--color-text-muted);display:flex;align-items:center;gap:6px;}

/* New booking screen */
.new-booking-card{background:var(--color-surface-2);border:1px solid var(--color-border);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:10px;}
.service-type-row{display:flex;gap:6px;}
.svc-btn{background:var(--color-surface);border:1.5px solid var(--color-border);color:var(--color-text-muted);font-size:12px;font-weight:600;padding:6px 14px;border-radius:7px;cursor:pointer;transition:all .15s;}
.svc-btn:hover{border-color:var(--color-primary);color:var(--color-primary);}
.svc-btn.selected{background:var(--color-primary);border-color:var(--color-primary);color:#fff;}
.avail-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;}
.slot-btn{border-radius:6px;font-size:11px;font-weight:600;padding:7px 4px;border:1.5px solid;cursor:pointer;transition:all .15s;text-align:center;}
.slot-open{background:var(--color-success-bg);border-color:rgba(26,127,75,.3);color:var(--color-success);}
.slot-open:hover{background:var(--color-success);color:#fff;border-color:var(--color-success);}
.slot-waitlist{background:var(--color-warning-bg);border-color:rgba(180,83,9,.3);color:var(--color-warning);}
.slot-full{background:var(--color-surface-2);border-color:var(--color-border);color:var(--color-text-faint);cursor:not-allowed;opacity:.6;}
.guest-stepper-row{display:flex;align-items:center;gap:10px;}
.basket-area{border-top:1px solid var(--color-border);padding-top:10px;}
.basket-empty{font-size:12px;color:var(--color-text-faint);padding:8px 0;text-align:center;}

/* ── V5: TYPING INDICATOR ── */
@keyframes typingBounce{0%,60%,100%{transform:translateY(0);opacity:.4;}30%{transform:translateY(-5px);opacity:1;}}
.typing-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--color-text-faint);animation:typingBounce 1.2s ease-in-out infinite;margin:0 2px;}
.typing-dot:nth-child(2){animation-delay:.2s;}
.typing-dot:nth-child(3){animation-delay:.4s;}
.typing-bubble{display:flex;align-items:center;min-width:52px;padding:10px 14px!important;}

/* ── V5: CONFIDENCE BADGE ── */
.conf-badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:100px;font-size:11px;font-weight:600;margin-left:8px;}
.conf-high{background:var(--color-success-bg);color:var(--color-success);}
.conf-med{background:var(--color-warning-bg);color:var(--color-warning);}
.conf-low{background:var(--color-danger-bg);color:var(--color-danger);}
.conf-chip{background:var(--color-surface-2);color:var(--color-text-muted);}

/* Interpretation bubble */
.interpret-row{display:flex;flex-wrap:wrap;align-items:center;gap:4px;}
.interpret-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--color-text-faint);}
.interpret-intent{font-size:13px;font-weight:500;color:var(--color-text);}

/* Operator bubble */
.msg-operator{display:flex;justify-content:flex-end;margin:4px 0;}
.op-bubble{background:var(--color-surface-2);border:1px solid var(--color-border);border-radius:12px 12px 2px 12px;padding:8px 14px;font-size:13px;color:var(--color-text-muted);max-width:380px;}

/* ── V5: BRIEFING BLOCK ── */
.briefing-block{background:var(--color-primary-light);border:1px solid #C4B5E8;border-radius:8px;padding:14px 16px;font-size:12px;margin:8px 0;}
.briefing-title{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--color-primary-dark);margin-bottom:10px;}
.briefing-row{display:flex;gap:10px;margin-bottom:8px;line-height:1.5;}
.briefing-row:last-child{margin-bottom:0;}
.briefing-icon{flex-shrink:0;font-size:14px;margin-top:1px;}
.briefing-detail{color:var(--color-text-muted);display:block;font-size:11px;}

/* ── V5: DISCOUNT HINT ── */
.discount-hint{background:#FFFBEB;border:1px solid #FDE68A;border-left:3px solid #B45309;border-radius:8px;padding:12px 16px;font-size:12px;margin:6px 0 6px 38px;max-width:580px;}
.dh-top{display:flex;gap:10px;align-items:flex-start;margin-bottom:10px;}
.dh-icon{font-size:16px;flex-shrink:0;}
.dh-dismiss{margin-left:auto;border:none;background:transparent;cursor:pointer;color:var(--color-text-faint);font-size:16px;line-height:1;padding:0 0 0 8px;}
.dh-dismiss:hover{color:var(--color-text);}
.dh-actions{display:flex;gap:8px;padding-left:26px;}
.btn-warning-outline{background:transparent;border:1px solid var(--color-warning);color:var(--color-warning);padding:4px 10px;border-radius:6px;font-size:11px;font-weight:600;cursor:pointer;transition:all .15s;}
.btn-warning-outline:hover{background:var(--color-warning-bg);}
.btn-ghost{background:transparent;border:1px solid var(--color-border);color:var(--color-text-muted);padding:4px 10px;border-radius:6px;font-size:11px;cursor:pointer;transition:all .15s;}
.btn-ghost:hover{border-color:var(--color-text-muted);color:var(--color-text);}

/* ── V5: DRAFT NOTE ── */
.draft-note-section{background:var(--color-surface-2);border:1px solid var(--color-border);border-radius:8px;padding:12px;margin:12px 0;}
.draft-note-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--color-text-faint);margin-bottom:8px;}
.draft-note-textarea{width:100%;border:1px solid transparent;border-radius:4px;padding:8px;font-size:12px;font-family:var(--font-base);background:transparent;resize:none;line-height:1.5;color:var(--color-text);}
.draft-note-textarea.editing{border-color:var(--color-primary);background:#fff;outline:none;}
.draft-note-actions{display:flex;gap:8px;margin-top:8px;}
.btn-success-solid{background:var(--color-success);color:#fff;border:1px solid var(--color-success);padding:5px 12px;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;transition:all .15s;}
.btn-success-solid:hover{background:#15673e;}
.btn-success-solid.saved{background:#15673e;cursor:default;}
.customer-summary-section{border-top:1px solid var(--color-border);padding-top:12px;margin-top:4px;}
.cs-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--color-text-faint);margin-bottom:6px;}
.cs-text{font-size:12px;color:var(--color-text);line-height:1.6;font-style:italic;margin-bottom:8px;}

/* ── V6: CALL ENDED STATE ── */
.call-bar-card.ended{background:#2A1A1A;}
.call-bar-card.ended .call-bar-timer{color:#9090A8;}
.call-bar-card.ended .call-bar-label{color:#9090A8;}
.call-status-ended-label{color:#D04060;font-size:11px;margin-right:4px;font-weight:600;}
.cb-btn.cb-disabled{opacity:0.35;pointer-events:none;cursor:not-allowed;}
.cb-dismiss-btn{background:transparent;border:none;color:#9090A8;font-size:12px;cursor:pointer;padding:4px 10px;border-radius:6px;white-space:nowrap;}
.cb-dismiss-btn:hover{color:#C0C0D0;}
@keyframes callBarFadeOut{from{opacity:1;transform:translateY(0);}to{opacity:0;transform:translateY(-8px);}}
.call-bar-card.dismissing{animation:callBarFadeOut 200ms ease forwards;}

/* ── V6: CALL ENDED LEFT PANEL INDICATOR ── */
.call-ended-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#9090A8;flex-shrink:0;}
</style>
</head>
<body>

<!-- INFIOS TOP NAV -->
<header class="top-nav" role="banner">
  <span class="top-nav-brand">infios</span>
  <div class="top-nav-sep"></div>
  <span class="top-nav-section">OMS Sites and Channels</span>

function getCallElapsed() {
  if (!app.call.startTime) return app.call.pausedElapsed;
  return Math.floor((Date.now() - app.call.startTime) / 1000) + app.call.pausedElapsed;
}

function formatTime(secs) {
  const m = String(Math.floor(secs / 60)).padStart(2, '0');
  const s = String(secs % 60).padStart(2, '0');
  return `${m}:${s}`;
}

function tickTimer() {
  if (!app.call.active || app.call.isOnHold) return;
  const display = formatTime(getCallElapsed());
  const cbTimer = document.getElementById('call-bar-timer');
  if (cbTimer) cbTimer.textContent = display;
  const callTabTimer = document.getElementById('call-tab-timer');
  if (callTabTimer) callTabTimer.textContent = display;
}

// ─────────────────────────────────────────────
// SWITCH SCREEN
// ─────────────────────────────────────────────
function switchScreen(n) {
  const cfg = SCREEN_CFG[n];
  if (!cfg) return;

  if (app.call.intervalId) { clearInterval(app.call.intervalId); app.call.intervalId = null; }
  if (app.cancelTimer) { clearTimeout(app.cancelTimer); app.cancelTimer = null; }

  app.screen = n;
  app.activeBookingId = cfg.activeBookingId;
  app.showCustomer = cfg.showCustomer;
  app.channel = cfg.channel;
  app.leftTab = cfg.leftTab;
  app.cancelStep = 0;
  app.previewShown = false;
  app.modifyGuests = 3;
  app.modifyTime = '10:00';
  app.summaryOpen = false;
  app.keypadOpen = false;
  app.keypadInput = '';

  app.call.endConfirmMode = false;
  app.discountHintDismissed = false;
  app.noteSaved = false;
  app.call.isMuted = false;
  app.call.isOnHold = false;
  app.call.pausedElapsed = 0;
  app.call.callEnded = false;
  app.call.callEndedTime = '00:00';

  app.call.active = cfg.callActive;
  if (cfg.callActive) {
    app.call.startTime = Date.now();
    app.call.intervalId = setInterval(tickTimer, 1000);
  } else {
    app.call.startTime = null;
  }

  app.rightPanel.open = cfg.rightPanel || false;
  app.rightPanel.mode = cfg.rpMode || null;
  app.rightPanel.bookingId = cfg.rpBid || null;

  renderAll();
}

function statusBadgeClass(s) {
  if (!s) return 'badge-confirmed';
  const u = s.toUpperCase();
  if (u === 'CONFIRMED') return 'badge-confirmed';
  if (u === 'ON HOLD') return 'badge-on-hold';
  if (u === 'CANCELLED') return 'badge-cancelled';
  return 'badge-confirmed';
}

function outcomeBadgeClass(o) {
  if (o === 'Resolved') return 'badge-resolved';
  if (o === 'Escalated') return 'badge-escalated';
  if (o === 'Callback') return 'badge-callback';
  return 'badge-resolved';
}

    return matchFilter && matchSearch;
  });

  const filterOptions = ['all', 'CONFIRMED', 'ON HOLD', 'CANCELLED'];

  let html = `

    <div class="bookings-list">
  `;

  if (filtered.length === 0) {
    html += `<div style="padding:20px;text-align:center;color:var(--color-text-faint);font-size:12px;">No bookings found</div>`;

                  <span id="guest-count">${app.modifyGuests}</span>
                  <button class="stepper-btn" data-action="guest-plus">+</button>
                </div>
              </div>
            </div>
            <div class="avail-indicator avail-ok" id="avail-indicator">✓ Available</div>
          </div>
        `).join('')}
        <div class="diff-section" id="modify-diff" ${app.previewShown?'':'hidden'}>
          <div class="diff-label">BEFORE / AFTER</div>
          <div class="diff-row">
            <span class="diff-before" id="diff-before">Time: 10:00 · Guests: 3</span>
            <span class="diff-arrow">→</span>
            <span class="diff-after" id="diff-after">Time: ${app.modifyTime} · Guests: ${app.modifyGuests}</span>
          </div>
          <div class="diff-price">Price diff: £0.00</div>
        </div>
        <div class="rp-actions">
          <button class="btn btn-secondary" data-action="preview-changes" id="btn-preview">Preview changes</button>
          <button class="btn btn-primary" data-action="confirm-modify" id="btn-confirm-mod" ${app.previewShown?'':'disabled'} style="opacity:${app.previewShown?1:.4};cursor:${app.previewShown?'pointer':'not-allowed'}">Confirm modification</button>
        </div>
        <div class="rp-actions" style="margin-top:6px">
          <button class="btn btn-secondary" data-action="close-right-panel">Cancel</button>
        </div>
      </div>
    `;
  }

  if (mode === 'cancel') {
    const cancelBtnText = app.cancelStep === 1 ? 'Click again to confirm ▸' : 'Confirm cancellation';
    const cancelBtnClass = app.cancelStep === 1 ? 'btn btn-danger-solid' : 'btn btn-danger-confirm';
    html += `
      <div class="rp-body">
        <div class="cancel-scope">
          <div class="scope-row"><span class="scope-label">Booking</span><span class="scope-val">BK-78440-mp1dzew3</span></div>
          <div class="scope-row"><span class="scope-label">Guest</span><span class="scope-val">Scarlett White · White Group</span></div>
          <div class="scope-row"><span class="scope-label">Items</span><span class="scope-val">Havana Bar Package · 10 Jun 2026 · 14:00 · 2 guests</span></div>
          <div class="scope-row"><span class="scope-label">Sail</span><span class="scope-val">10 Jun 2026 · Carnival Venezia</span></div>
        </div>
        <div class="refund-box">
          <div class="refund-row"><span>Services</span><span>£77.96</span></div>
          <div class="refund-row"><span>Cancellation fee</span><span>£0.00</span></div>
          <div class="refund-row refund-total"><span>Net refund</span><strong>£77.96</strong></div>
        </div>
        <div class="policy-note">Full refund applies. Cancellation received 31+ days before sailing. No fee per Carnival UK policy §4.2.</div>
        <div class="rp-actions">
          <button class="${cancelBtnClass}" id="btn-cancel-confirm" data-action="cancel-step" aria-label="Confirm cancellation of BK-78440-mp1dzew3">
            ${cancelBtnText}
          </button>
          <button class="btn btn-secondary" data-action="close-right-panel">Keep booking</button>
        </div>
      </div>
    `;
  }

  if (mode === 'blocked') {
    html += `
      <div class="rp-body">
        <div class="blocked-header-box">
          <span class="blocked-tag">SOLD OUT</span>
          <p style="font-size:13px;font-weight:600;margin-top:4px">Color Crush Massage · 11 Jun 2026 · 14:00</p>
          <p style="font-size:12px;color:var(--color-text-muted)">No availability for this time slot.</p>
        </div>
        <div class="section-label">ALTERNATIVE SLOTS</div>
        <table class="alt-table">
          <tr><td>09:00</td><td><span class="badge badge-success">Available</span></td><td><button class="btn btn-sm btn-success-outline" data-action="select-slot" data-time="09:00">Select</button></td></tr>
          <tr><td>10:00</td><td><span class="badge badge-success">Available</span></td><td><button class="btn btn-sm btn-success-outline" data-action="select-slot" data-time="10:00">Select</button></td></tr>
          <tr><td>11:00</td><td><span class="badge badge-warning">Wait list</span></td><td><button class="btn btn-sm btn-secondary" data-action="select-slot" data-time="11:00">Join waitlist</button></td></tr>
          <tr><td>14:00</td><td><span class="badge badge-danger">Sold out</span></td><td style="color:var(--color-text-faint)">—</td></tr>
        </table>
        <div class="rp-actions" style="margin-top:12px">

  el.innerHTML = html;
}

// ─────────────────────────────────────────────
// PANEL ACTIONS
// ─────────────────────────────────────────────
function openRightPanel(mode, bookingId) {
  app.rightPanel.open = true;
  app.rightPanel.mode = mode;
  app.rightPanel.bookingId = bookingId;
  document.getElementById('app').classList.add('right-open');
  renderRightPanel();
  if (window.lucide) lucide.createIcons();
}

function closeRightPanel() {
  app.rightPanel.open = false;
  document.getElementById('app').classList.remove('right-open');
  const rp = document.getElementById('panel-right');
  if (rp) rp.innerHTML = '';
}

// ─────────────────────────────────────────────
// EVENT HANDLERS
// ─────────────────────────────────────────────
function handleCallBarAction(action, btn) {
  if (action === 'cb-toggle-hold') {
    app.call.isOnHold = !app.call.isOnHold;
    if (app.call.isOnHold) {
      app.call.pausedElapsed = getCallElapsed();
      app.call.startTime = null;
    } else {
      app.call.startTime = Date.now();
    }
    renderCallBar();
    // Update hold badge
    const holdBadge = document.getElementById('hold-badge');
    if (holdBadge) holdBadge.hidden = !app.call.isOnHold;
    if (window.lucide) lucide.createIcons();
    return;
  }
  if (action === 'cb-toggle-mute') {
    app.call.isMuted = !app.call.isMuted;
    renderCallBar();
    if (window.lucide) lucide.createIcons();
    return;
  }
  if (action === 'cb-keypad') {
    app.keypadOpen = !app.keypadOpen;
    app.contactsOpen = false;
    renderCallBar(); if (window.lucide) lucide.createIcons(); return;
  }
  if (action === 'cb-contacts') {
    app.contactsOpen = !app.contactsOpen;
    app.keypadOpen = false;
    renderCallBar(); if (window.lucide) lucide.createIcons(); return;
  }
  if (action === 'close-keypad') { app.keypadOpen = false; renderCallBar(); if (window.lucide) lucide.createIcons(); return; }
  if (action === 'keypad-digit') {
    app.keypadInput += btn.dataset.digit || '';
    const display = document.getElementById('keypad-display');
    if (display) display.textContent = app.keypadInput;
    return;
  }
  if (action === 'cb-end-call') {
    app.call.endConfirmMode = true;
    renderCallBar(); if (window.lucide) lucide.createIcons(); return;
  }
  if (action === 'confirm-end-call') {
    const frozenTime = formatTime(getCallElapsed());
    if (app.call.intervalId) { clearInterval(app.call.intervalId); app.call.intervalId = null; }
    app.call.active = false;
    app.call.endConfirmMode = false;
    app.call.callEnded = true;
    app.call.callEndedTime = frozenTime;
    renderCallBar();
    if (window.lucide) lucide.createIcons();
    // Update On Going tab call indicator without switching tabs
    renderLeftPanel();
    if (window.lucide) lucide.createIcons();
    attachEvents();
    return;
  }
  if (action === 'cancel-end-call') {
    app.call.endConfirmMode = false;
    renderCallBar(); if (window.lucide) lucide.createIcons(); return;
  }
  if (action === 'dismiss-call-bar') {
    const bar = document.getElementById('floating-call-bar');
    if (bar) {
      bar.classList.add('dismissing');
      setTimeout(() => { bar.hidden = true; bar.classList.remove('dismissing', 'ended'); }, 200);
    }
    app.call.callEnded = false;
    return;
  }
}

function handleLeftAction(action, id, btn) {
  if (action === 'set-active') {
    app.activeBookingId = id;
    renderLeftPanel(); renderCenter(); if (window.lucide) lucide.createIcons(); attachEvents(); return;
  }
  if (action === 'quick-modify') { switchScreen(4); return; }
  if (action === 'quick-cancel') { switchScreen(5); return; }
  if (action === 'quick-lookup') { switchScreen(3); return; }
}

function handleCenterAction(action, id, btn) {
  if (action === 'open-right-modify') { openRightPanel('modify', id || app.activeBookingId); return; }
  if (action === 'open-right-cancel') { openRightPanel('cancel', id || 'BK-78440-mp1dzew3'); return; }
  if (action === 'open-right-panel') {
    if (app.rightPanel.mode) { app.rightPanel.open = true; document.getElementById('app').classList.add('right-open'); renderRightPanel(); if (window.lucide) lucide.createIcons(); }
    return;
  }
  if (action === 'go-1') { switchScreen(1); return; }
  if (action === 'go-2') { switchScreen(2); return; }
  if (action === 'go-3') { switchScreen(3); return; }
  if (action === 'go-4') { switchScreen(4); return; }
  if (action === 'go-5') { switchScreen(5); return; }
  if (action === 'toggle-summary') {
    app.summaryOpen = !app.summaryOpen;
    const content = document.getElementById('customer-summary');
    if (content) content.hidden = !app.summaryOpen;
    return;
  }
  if (action === 'dismiss-hint') {
    app.discountHintDismissed = true;
    const hint = document.getElementById('discount-hint');
    if (hint) hint.remove();
    return;
  }
  if (action === 'mention-hint') {
    const text = 'Thursday 12 Jun is 15% cheaper — same 10:00 slot available.';
    navigator.clipboard.writeText(text).catch(() => {});
    btn.textContent = '✓ Copied';
    btn.disabled = true;
    return;
  }
  if (action === 'save-note') {
    if (app.noteSaved) return;
    btn.textContent = 'Saving…';
    btn.disabled = true;
    setTimeout(() => {
      app.noteSaved = true;
      btn.textContent = '✓ Saved';
      btn.classList.add('saved');
    }, 900);
    return;
  }
  if (action === 'edit-note') {
    const ta = document.getElementById('draft-note-textarea');
    if (ta) { ta.classList.add('editing'); ta.focus(); }
    return;
  }
  if (action === 'copy-summary') {
    const el = document.getElementById('cs-text');
    const text = el ? el.textContent.trim() : '';
    navigator.clipboard.writeText(text).catch(() => {});
    btn.textContent = '✓ Copied';
    btn.disabled = true;
    return;
  }
}

function handleRightAction(action, time, btn) {
  if (action === 'close-right-panel') { closeRightPanel(); return; }
  if (action === 'preview-changes') {
    app.previewShown = true;
    const diff = document.getElementById('modify-diff');
    if (diff) diff.hidden = false;
    const modTime = document.getElementById('mod-time');
    const newTime = modTime ? modTime.value : app.modifyTime;
    app.modifyTime = newTime;
    const before = document.getElementById('diff-before');
    const after = document.getElementById('diff-after');
    if (before) before.textContent = `Time: 10:00 · Guests: 3`;
    if (after) after.textContent = `Time: ${app.modifyTime} · Guests: ${app.modifyGuests}`;
    const confirmBtn = document.getElementById('btn-confirm-mod');
    if (confirmBtn) { confirmBtn.disabled = false; confirmBtn.style.opacity = '1'; confirmBtn.style.cursor = 'pointer'; }
    return;
  }
  if (action === 'mod-time-change') {
    app.modifyTime = btn.value;
    if (app.previewShown) {
      const after = document.getElementById('diff-after');
      if (after) after.textContent = `Time: ${app.modifyTime} · Guests: ${app.modifyGuests}`;
    }
    return;
  }
  if (action === 'guest-plus') {
    app.modifyGuests = Math.min(10, app.modifyGuests + 1);
    const el = document.getElementById('guest-count');
    if (el) el.textContent = app.modifyGuests;
    if (app.previewShown) {
      const after = document.getElementById('diff-after');
      if (after) after.textContent = `Time: ${app.modifyTime} · Guests: ${app.modifyGuests}`;
    }
    return;
  }
  if (action === 'guest-minus') {
    app.modifyGuests = Math.max(1, app.modifyGuests - 1);
    const el = document.getElementById('guest-count');
    if (el) el.textContent = app.modifyGuests;
    if (app.previewShown) {
      const after = document.getElementById('diff-after');
      if (after) after.textContent = `Time: ${app.modifyTime} · Guests: ${app.modifyGuests}`;
    }
    return;
  }
  if (action === 'confirm-modify') {
    if (!app.previewShown) return;
    closeRightPanel();
    switchScreen(8);
    return;
  }
  if (action === 'cancel-step') {
    if (app.cancelStep === 0) {
      app.cancelStep = 1;
      btn.textContent = 'Click again to confirm ▸';
      btn.classList.remove('btn-danger-confirm');
      btn.classList.add('btn-danger-solid');
      if (app.cancelTimer) clearTimeout(app.cancelTimer);
      app.cancelTimer = setTimeout(() => {
        app.cancelStep = 0;
        const b = document.getElementById('btn-cancel-confirm');
        if (b) { b.textContent = 'Confirm cancellation'; b.classList.remove('btn-danger-solid'); b.classList.add('btn-danger-confirm'); }
      }, 4000);
    } else if (app.cancelStep === 1) {
      clearTimeout(app.cancelTimer);
      app.cancelTimer = null;
      app.cancelStep = 0;
      closeRightPanel();
      switchScreen(8);
    }
    return;
  }
  if (action === 'select-slot') {
    closeRightPanel();
    switchScreen(2);
    return;
  }
  if (action === 'escalate') {
    alert('Escalating to supervisor. Ticket created.');
    return;
  }
}

// ─────────────────────────────────────────────
// NL PROCESSING
// ─────────────────────────────────────────────
function interpretCommand(text) {
  const t = text.toLowerCase();
  if (/cancel|cancell/.test(t)) {
    return { cardType: 'cancel', intent: 'Cancel booking BK-78440-mp1dzew3', confidence: 92 };
  }
  if (/modif|change|move|reschedul|spa/.test(t)) {
    const hasDate = /\d{1,2}(th|st|nd|rd)?[\s-]*(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec|\d{1,2})/i.test(t) || /\d{1,2}(th|st|nd|rd)/.test(t) || /12th|11th|13th/.test(t);
    const confidence = hasDate ? 95 : 78;
    const dateStr = hasDate ? '11 Jun → 12 Jun' : 'current date';
    return { cardType: 'modify', intent: `Modify spa line item on BK-78431 · date: ${dateStr}`, confidence };
  }
  if (/look.?up|find|search|booking/.test(t)) {
    return { cardType: 'lookup', intent: 'Look up booking details', confidence: 88 };
  }
  if (/new.?book|add.?book/.test(t)) {
    return { cardType: 'new-booking', intent: 'Start new booking for Grace Chen', confidence: 85 };
  }
  return { cardType: 'general', intent: text, confidence: 61 };
}

function confBadgeHtml(confidence) {
  if (confidence === null) return `<span class="conf-badge conf-chip">chip</span>`;
  if (confidence >= 95) return `<span class="conf-badge conf-high" aria-label="Agent confidence: ${confidence} percent">${confidence}% · High confidence</span>`;
  if (confidence >= 75) return `<span class="conf-badge conf-med" aria-label="Agent confidence: ${confidence} percent">${confidence}% · Medium confidence</span>`;
  return `<span class="conf-badge conf-low" aria-label="Agent confidence: ${confidence} percent">${confidence}% · Low confidence</span>`;
}

function appendToChat(html) {
  const feed = document.getElementById('chat-area');
  if (!feed) return;
  const div = document.createElement('div');
  div.innerHTML = html;
  while (div.firstChild) feed.appendChild(div.firstChild);
  feed.scrollTop = feed.scrollHeight;
  if (window.lucide) lucide.createIcons();
}

function processNLInput(text) {
  if (!text || !text.trim()) return;
  const input = document.getElementById('chat-input');
  if (input) input.value = '';

  // Operator bubble
  appendToChat(`<div class="msg-operator"><div class="op-bubble">${text}</div></div>`);

  // Step 1: typing indicator
  setTimeout(() => {
    appendToChat(`<div class="msg-agent" id="typing-indicator"><div class="agent-avatar"><i data-lucide="sparkles"></i></div><div class="agent-bubble typing-bubble"><span class="typing-dot"></span><span class="typing-dot"></span><span class="typing-dot"></span></div></div>`);
    if (window.lucide) lucide.createIcons();

    // Step 2: interpretation message
    setTimeout(() => {
      const typingEl = document.getElementById('typing-indicator');
      if (typingEl) typingEl.remove();
      const { cardType, intent, confidence } = interpretCommand(text);
      appendToChat(agentBubble(`<div class="interpret-row"><span class="interpret-label">I understood:</span> <span class="interpret-intent">${intent}</span>${confBadgeHtml(confidence)}</div>`));

      // Step 3: action card
      setTimeout(() => {
        const screenMap = { modify: 4, cancel: 5, lookup: 3, 'new-booking': 7, general: 2 };
        const targetScreen = screenMap[cardType] || 2;
        appendToChat(`<div class="action-in-progress">
          <i data-lucide="zap"></i>
          <span>Routing to <strong>${cardType.replace('-', ' ')}</strong> flow</span>
          <button class="btn btn-sm btn-secondary" data-action="go-${targetScreen}" style="margin-left:auto">Continue →</button>
        </div>`);
        if (window.lucide) lucide.createIcons();

        // Step 4: discount hint for modify with date
        if (cardType === 'modify' && !app.discountHintDismissed) {
          setTimeout(() => {
            appendToChat(`<div class="discount-hint" id="discount-hint">
              <div class="dh-top">
                <span class="dh-icon">💡</span>
                <div><strong>Heads up — Thursday 12 Jun is 15% cheaper</strong><br>Same time slot (10:00) is available. Worth mentioning?</div>
                <button class="dh-dismiss" data-action="dismiss-hint" aria-label="Dismiss deal hint">✕</button>
              </div>
              <div class="dh-actions">
                <button class="btn-warning-outline" data-action="mention-hint" id="btn-mention-hint">Mention to customer</button>
                <button class="btn-ghost" data-action="dismiss-hint">Dismiss</button>
              </div>
            </div>`);
          }, 600);
        }
      }, 400);
    }, 800);
  }, 300);
}

// ─────────────────────────────────────────────
// ATTACH EVENTS
// ─────────────────────────────────────────────
function attachEvents() {
  // Toolbar
  const toolbar = document.getElementById('dev-toolbar');
  toolbar.onclick = e => {
    const btn = e.target.closest('[data-screen]');
    if (btn) switchScreen(+btn.dataset.screen);
  };

  // Call bar
  const callBar = document.getElementById('floating-call-bar');
  callBar.onclick = e => {
    const btn = e.target.closest('[data-action]');
    if (!btn) return;
    handleCallBarAction(btn.dataset.action, btn);
  };

  // Left panel delegation
  const lp = document.getElementById('panel-left');
  lp.onclick = e => {
    // Tab buttons
    const tabBtn = e.target.closest('[data-tab]');
    if (tabBtn) {
      app.leftTab = tabBtn.dataset.tab;
      renderLeftPanel();
      if (window.lucide) lucide.createIcons();
      attachEvents();
      return;
    }
    // Filter chips
    const filterBtn = e.target.closest('[data-filter]');
    if (filterBtn) {
      app.bookingsFilter = filterBtn.dataset.filter;
      renderLeftPanel();
      if (window.lucide) lucide.createIcons();
      attachEvents();
      return;
    }
    // Action buttons
    const btn = e.target.closest('[data-action]');
    if (!btn) return;
    handleLeftAction(btn.dataset.action, btn.dataset.id, btn);
  };

  // Bookings search
  const bkSearch = document.getElementById('bookings-search');
  if (bkSearch) {
    bkSearch.oninput = e => {
      app.bookingsSearch = e.target.value;
      // Re-render just the list portion
      const lp2 = document.getElementById('panel-left');
      if (lp2 && app.leftTab === 'bookings') {
        renderLeftPanel();
        if (window.lucide) lucide.createIcons();
        attachEvents();
      }
    };
    // Prevent click propagation from clearing filter
    bkSearch.onclick = e => e.stopPropagation();
  }

  // Center / workspace
  const ws = document.getElementById('agent-workspace');
  ws.onclick = e => {
    const btn = e.target.closest('[data-action]');
    if (!btn) return;
    handleCenterAction(btn.dataset.action, btn.dataset.id, btn);
  };

  // Right panel
  const rp = document.getElementById('panel-right');
  rp.onclick = e => {
    const btn = e.target.closest('[data-action]');
    if (!btn) return;
    handleRightAction(btn.dataset.action, btn.dataset.time, btn);
  };

  // Right panel select change
  rp.onchange = e => {
    if (e.target.dataset.action === 'mod-time-change') {
      handleRightAction('mod-time-change', null, e.target);
    }
  };

  // Customer need char count
  const need = document.getElementById('customer-need');
  if (need) {
    need.oninput = () => {
      const cc = document.querySelector('.char-count');
      if (cc) cc.textContent = `${need.value.length}/120`;
    };
  }

  // Chat input — NL commands
  const chatInput = document.getElementById('chat-input');
  const sendBtn = document.querySelector('.send-btn');
  if (chatInput) {
    chatInput.onkeydown = e => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        processNLInput(chatInput.value.trim());
      }
    };
  }
  if (sendBtn) {
    sendBtn.onclick = () => {
      const ci = document.getElementById('chat-input');
      if (ci) processNLInput(ci.value.trim());
    };
  }

  // New session btn in header
  const newSessionBtn = document.querySelector('.new-session-btn');
  if (newSessionBtn) {
    newSessionBtn.onclick = () => switchScreen(1);
  }

  // Escape key
  document.onkeydown = e => {
    if (e.key === 'Escape') {
      if (app.rightPanel.open) closeRightPanel();
      if (app.keypadOpen || app.contactsOpen) {
        app.keypadOpen = false;
        app.contactsOpen = false;
        renderCallBar();
        if (window.lucide) lucide.createIcons();
      }
    }
  };
}

});
